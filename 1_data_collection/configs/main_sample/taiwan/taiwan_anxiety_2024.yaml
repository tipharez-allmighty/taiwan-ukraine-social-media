# yt-scraper job: "Anxiety" phase (Taiwan discourse mirrored to the
# Russo-Ukrainian war timeline)
# Jan 2024 - Oct 2024: critical ammunition shortages driven by U.S.
# congressional delays; loss of Avdiivka; exhausting war of attrition.
#
# NOTE: unlike the ukraine_*.yaml jobs (one state_file per phase), all
# taiwan_*.yaml jobs in this folder share a single state_file so results
# accumulate together.
#
# Run with:
#   (run from the folder where the state_file should be written)
#   yt-scraper run -f yaml < taiwan/taiwan_anxiety_2024.yaml

