# yt-scraper job: "Betrayal & Despair" phase (Taiwan discourse mirrored to
# the Russo-Ukrainian war timeline)
# Feb 2025 - Oct 2025: harsh Trump-Zelensky Oval Office clash; freezing of
# U.S. aid; rejection of long-range weapons; U.S. approval drops to 7%
# within Ukraine.
#
# NOTE: unlike the ukraine_*.yaml jobs (one state_file per phase), all
# taiwan_*.yaml jobs in this folder share a single state_file so results
# accumulate together.
#
# Run with:
#   (run from the folder where the state_file should be written)
#   yt-scraper run -f yaml < taiwan/taiwan_betrayal_despair_2025.yaml

